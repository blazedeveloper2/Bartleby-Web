<!doctype html>
<!-- Every exercise's 3D rep, frame by frame, for checking them all at a
     glance after a change to apps/workout/moves.js, rig.js or stage.js.
     Serve the repo root and open /tools/howto/anim (no .html: the dev
     server's clean URLs drop the query along with it).
       ?q=press,curl   only exercises whose name contains one of these
       ?i=0&n=12       a slice of the list, in program order
       ?w=300&h=200    frame size in pixels
       ?az=90&el=10    look from another angle than the exercise's own
       ?zoom=0.5       closer (under 1) or further (over 1)
       ?theme=light    any data-theme from assets/css/themes.css
       ?play           live loops instead of still frames -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise animations</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/themes.css">
<link rel="stylesheet" href="../../apps/workout/workout.css">
<style>
  body{margin:0;padding:12px;background:var(--bg-card);color:var(--text);font:12px/1.4 system-ui,sans-serif}
  .ex{margin:0 0 10px;padding:8px;border:1px solid var(--border);border-radius:8px}
  .ex h2{margin:0 0 6px;font-size:12px;font-weight:600}
  .ex h2 small{color:var(--text-3);font-weight:400}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .row figure{margin:0}
  .row img{display:block;border-radius:8px;background:radial-gradient(ellipse 80% 70% at 50% 38%,var(--bg-alt),var(--bg) 78%)}
  .row figcaption{font-size:10px;color:var(--text-3);text-align:center}
  .live{width:520px}
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
  const qs = new URLSearchParams(location.search);
  if (qs.get('theme')) document.documentElement.setAttribute('data-theme', qs.get('theme'));
  const v = Date.now();
  const { MOTION } = await import('../../apps/workout/moves.js?v=' + v);
  const pose = await import('../../apps/workout/pose.js?v=' + v);
  const stage = await import('../../apps/workout/stage.js?v=' + v);
  await stage.ready(qs.get('model') || 'trainer');
  let names = Object.keys(MOTION);
  if (qs.get('q')) { const qq = qs.get('q').toLowerCase().split(','); names = names.filter(n => qq.some(q => n.toLowerCase().includes(q))); }
  const i = +(qs.get('i') || 0), n = +(qs.get('n') || names.length);
  names = names.slice(i, i + n);
  const w = +(qs.get('w') || 300), h = +(qs.get('h') || 200);
  const opts = { az: qs.has('az') ? +qs.get('az') : null, el: qs.has('el') ? +qs.get('el') : null, zoom: qs.has('zoom') ? +qs.get('zoom') : null };
  const out = document.getElementById('out');
  for (const name of names) {
    const m = MOTION[name];
    const poses = [...new Set(m.tempo.map(([p]) => p))];
    const div = document.createElement('div');
    div.className = 'ex';
    div.innerHTML = `<h2>${name} <small>${m.tempo.map(t => t[2] + ' ' + t[1] + 's').join(' / ')}</small></h2><div class="row"></div>`;
    out.append(div);
    const row = div.querySelector('.row');
    if (qs.has('play')) {
      row.innerHTML = `<div class="live">${pose.animHTML(name)}</div>`;
      pose.playAnim(row.querySelector('.mm-anim'), name);
    } else {
      for (const p of poses) {
        const f = document.createElement('figure');
        f.innerHTML = `<img width="${w}" height="${h}" src="${stage.stillImage(name, p, w, h, opts)}" alt=""><figcaption>${p}</figcaption>`;
        row.append(f);
      }
    }
  }
  document.body.dataset.done = '1';
</script>
</body>
</html>
