<!-- Every app's stylesheet, render-blocking and up front. shell.js loads these
     anyway on boot, but from JS, which does not block paint: the app's markup
     went into the DOM in the gap before its CSS landed, and the rule hiding
     inactive panels lives in that CSS -- so all three panels painted at once
     and then collapsed to one. Pages serves even ?v= tagged files with
     max-age=600, so that gap reopened every ten minutes rather than once. -->
<link rel="stylesheet" href="apps/workout/workout.css?v=check-sep26">
<link rel="stylesheet" href="apps/finance/finance.css?v=check-sep26">
<script>
/* Set the theme before first paint so there's no flash of the wrong palette.
   Kept inline and dependency-free on purpose — assets/js/theme.js owns the
   real logic, this just mirrors the stored value as early as possible. */
(function(){
  /* Keep MOTION in step with THEMES in assets/js/theme.js. */
  var MOTION = { arcade:'loud', black:'quiet', dark:'quiet', light:'none' };
  var t = 'arcade';
  try { var s = JSON.parse(localStorage.getItem('bs_theme')); if (MOTION[s]) t = s; } catch(e){}
  document.documentElement.setAttribute('data-theme', t);
  document.documentElement.setAttribute('data-motion', MOTION[t]);
})();
</script>

<script>
/* ═══ Self-update ═══
   Every script and stylesheet below carries a ?v=check-sep26 build tag, which handles
   caching for all of them. The one file that can't carry a tag is this one,
   and GitHub Pages serves it with max-age=600 — so for ten minutes after a
   deploy, and indefinitely in an installed PWA that never gets reloaded, the
   browser keeps handing out the previous index.html. That old copy asks for
   the old tagged files, which it also still has. The result is a deploy that
   succeeds and changes nothing on screen, with nothing anywhere saying so.

   So: ask the network what the current tag is, and if this page came from
   cache and the server has moved on, jump to a URL the cache has never seen.
   That fetch is the whole trick — the fresh HTML then pulls the fresh files.
   Guarded by sessionStorage so a surprise can never become a reload loop.

   The three matches below read the tag; they must never contain it. A
   find-and-replace that bumps the tag by rewriting the literal '?v=' will
   happily rewrite it inside these patterns too, and the capture group then
   sits behind the whole tag instead of around it, matches nothing, and the
   early return switches this entire check off without a sound. */
(function(){
  var here = (document.querySelector('script[src*="?v="]') || {}).src || '';
  here = (here.match(/\?v=([a-z0-9-]+)/) || [])[1];
  if (!here) return;
  fetch('index.html', { cache:'no-store' })
    .then(function(r){ return r.ok ? r.text() : null; })
    .then(function(t){
      if (!t) return;
      var live = (t.match(/\?v=([a-z0-9-]+)/) || [])[1];
      if (!live || live === here) return;
      if (sessionStorage.getItem('bs_build') === live) return;   // already tried
      sessionStorage.setItem('bs_build', live);
      location.replace(location.pathname + '?b=' + live);
    })
    .catch(function(){});                 /* offline is not an error here */
})();
</script>
